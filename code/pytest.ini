[pytest]

minversion = 6.0

addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    integration: marks tests as integration tests (they build and search a real mini knowledge graph)
    slow: marks tests as slow tests (they download models or do heavy computations)

testpaths = tests
norecursedirs = .git __pycache__ *.egg-info
